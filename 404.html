<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Page not found · DNSSEC Inspector</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to DNSSEC Inspector to validate a domain's chain of trust.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#4c1d95">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-1: #f5f3ff;
      --bg-2: #ede9fe;
      --text: #1e1b2e;
      --text-muted: #5b5470;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.6);
      --accent: #7c3aed;
      --accent-dark: #5b21b6;
      --accent-solid: #6d28d9;
      --accent-solid-hover: #5b21b6;
      --shadow-color: rgba(76, 29, 149, 0.18);
      --chip-bg: #ede9fe;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-1: #150f26;
        --bg-2: #1e1533;
        --text: #ece9f7;
        --text-muted: #a79fc2;
        --card-bg: rgba(30, 21, 51, 0.78);
        --card-border: rgba(255, 255, 255, 0.08);
        --accent: #a78bfa;
        --accent-dark: #c4b5fd;
        --accent-solid: #7c3aed;
        --accent-solid-hover: #6d28d9;
        --shadow-color: rgba(0, 0, 0, 0.5);
        --chip-bg: #241a3d;
      }
    }

    :root[data-theme="dark"] {
      --bg-1: #150f26;
      --bg-2: #1e1533;
      --text: #ece9f7;
      --text-muted: #a79fc2;
      --card-bg: rgba(30, 21, 51, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #a78bfa;
      --accent-dark: #c4b5fd;
      --accent-solid: #7c3aed;
      --accent-solid-hover: #6d28d9;
      --shadow-color: rgba(0, 0, 0, 0.5);
      --chip-bg: #241a3d;
    }

    body {
      background: linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1.6rem;
      box-shadow: 0 25px 50px -12px var(--shadow-color), inset 0 1px 2px rgba(255,255,255,0.1);
      width: 100%;
      max-width: 640px;
      padding: 3rem 2.5rem;
      border: 1px solid var(--card-border);
      text-align: center;
    }

    .error-code {
      font-size: clamp(4rem, 16vw, 7rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-dark);
      margin-bottom: 0.9rem;
    }

    .message {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .chain-broken {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--chip-bg);
      border-radius: 60px;
      padding: 0.6rem 1.4rem;
      margin-bottom: 2rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.95rem;
      color: var(--accent-dark);
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-solid);
      color: white;
      padding: 0.85rem 2rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s;
    }

    .primary-btn:hover { background: var(--accent-solid-hover); transform: scale(1.02); }

    footer { margin-top: 2rem; color: var(--text-muted); font-size: 0.85rem; }
    footer a { color: var(--text-muted); }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="error-code">404</div>
    <h1>Chain of trust broken</h1>
    <div class="message">This page doesn't resolve — the path you followed doesn't exist.</div>
    <div class="chain-broken">🔗💥 no DS record for this path</div>
    <div>
      <a href="/" class="primary-btn">🛡️ Back to DNSSEC Inspector</a>
    </div>
    <footer>
      <a href="https://hbenali.ovh" target="_blank" rel="noopener noreferrer">hbenali.ovh</a>
    </footer>
  </div>
</body>
</html>
