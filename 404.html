<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404, Page not found - DNSSEC Inspector</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to DNSSEC Inspector to validate a domain's chain of trust.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0c1218" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Absolute paths: this page is served for any missing URL, at any depth -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/big-shoulders-latin-wght.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/newsreader-latin-wght.woff2" crossorigin>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/site.css?v=5">
</head>
<body>
  <main class="nf wrap">
    <p class="display nf-code" aria-hidden="true">404</p>
    <h1 class="display">Chain of trust broken</h1>
    <p class="nf-lead">This page doesn't resolve. The path you followed doesn't exist.</p>
    <ul class="nf-links">
      <li><a class="link" href="/">Back to DNSSEC Inspector</a></li>
      <li><a class="link" href="https://hbenali.ovh" target="_blank" rel="noopener noreferrer">hbenali.ovh<span class="sr-only"> (opens in a new tab)</span></a></li>
    </ul>
    <p class="nf-log" aria-hidden="true"><span class="dim">$ </span>dig DS this-path<br><span class="err">no DS record for this path</span></p>
  </main>
</body>
</html>
